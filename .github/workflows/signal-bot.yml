name: Signal Bot v8 - Scheduled Scan

on:
  schedule:
    - cron: "*/5 * * * *"   # প্রতি ৫ মিনিটে
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run signal bot scan
        env:
          GAS_URL: ${{ secrets.GAS_URL }}
        run: python main.py
